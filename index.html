<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaussian Splatting em RA</title>
    <!-- Importa o componente model-viewer da Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        model-viewer { width: 100%; height: 80vh; background-color: #f0f0f0; }
    </style>
</head>
<body>

    <!-- Configuração do visualizador -->
    <model-viewer 
        src="inalador-isolado.splat" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        tone-mapping="neutral" 
        shadow-intensity="1"
        alt="Reconstrução 3D em Gaussian Splatting">
    </model-viewer>

</body>
</html>
